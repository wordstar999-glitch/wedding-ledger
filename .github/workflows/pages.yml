name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check script syntax
        run: |
          set -euo pipefail
          node -e "const s=require('fs').readFileSync('index.html','utf8');const m=[...s.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];if(!m.length)throw new Error('no inline script');m.forEach((x,i)=>require('fs').writeFileSync('/tmp/inline'+i+'.js',x[1]))"
          for f in /tmp/inline*.js xlsx.js sw.js; do node --check "$f"; done
      - name: Prepare deploy files
        run: |
          set -euo pipefail
          mkdir dist
          for f in index.html xlsx.js sw.js manifest.json icon-192.png icon-512.png; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
            cp "$f" dist/
          done
          sw_ver=$(grep -oE "gift-v[0-9]+" sw.js | head -1 | sed 's/gift-//')
          grep -q "APP_VERSION = '${sw_ver}'" index.html || { echo "ERROR: APP_VERSION in index.html does not match sw.js (${sw_ver})"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
